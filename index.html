<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>2048 · 方块合成</title>
  <style>
    :root {
      --ink: #263248;
      --muted: #78839a;
      --paper: #f7f8fc;
      --board: #c9d0dc;
      --cell: #dce1ea;
      --accent: #6f62dc;
      --accent-dark: #5248bd;
      --shadow: 0 22px 55px rgba(49, 61, 93, .16);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: var(--paper);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      z-index: -1;
      inset: 0 0 48% 0;
      background: linear-gradient(135deg, #f0efff, #f8f7ff 55%, #eef8ff);
    }

    .page {
      width: min(100% - 32px, 960px);
      margin: 0 auto;
      padding: 48px 0 64px;
    }

    .topbar, .intro, .game-area {
      max-width: 760px;
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 34px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: .04em;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      color: #fff;
      border-radius: 11px;
      background: var(--accent);
      box-shadow: 0 7px 16px rgba(111, 98, 220, .3);
    }

    .scores { display: flex; gap: 8px; }

    .score {
      min-width: 82px;
      padding: 8px 13px 9px;
      text-align: center;
      border: 1px solid rgba(119, 130, 157, .2);
      border-radius: 12px;
      background: rgba(255,255,255,.7);
    }

    .score-label {
      display: block;
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .08em;
    }

    .score-value { font-size: 21px; font-weight: 850; }

    .intro { margin-bottom: 23px; }
    h1 { margin: 0 0 8px; font-size: clamp(42px, 8vw, 64px); line-height: .96; letter-spacing: -.065em; }
    .intro p { margin: 0; color: var(--muted); font-size: 16px; }

    .game-area { position: relative; }

    .board-wrap {
      position: relative;
      padding: 14px;
      border-radius: 22px;
      background: var(--board);
      box-shadow: var(--shadow);
      touch-action: none;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      aspect-ratio: 1;
    }

    .cell {
      display: grid;
      place-items: center;
      border-radius: 13px;
      background: var(--cell);
      color: transparent;
      font-size: clamp(28px, 8vw, 48px);
      font-weight: 900;
      line-height: 1;
    }

    .cell[data-value="2"] { color: #454d63; background: #f3f5f8; }
    .cell[data-value="4"] { color: #454d63; background: #e8ebf3; }
    .cell[data-value="8"] { color: #fff; background: #a79be8; }
    .cell[data-value="16"] { color: #fff; background: #897bdd; }
    .cell[data-value="32"] { color: #fff; background: #7164d1; }
    .cell[data-value="64"] { color: #fff; background: #5a4ec2; }
    .cell[data-value="128"] { color: #fff; background: #4a82c7; font-size: clamp(24px, 7vw, 40px); }
    .cell[data-value="256"] { color: #fff; background: #3878bc; font-size: clamp(24px, 7vw, 40px); }
    .cell[data-value="512"] { color: #fff; background: #d28d50; font-size: clamp(24px, 7vw, 40px); }
    .cell[data-value="1024"], .cell[data-value="2048"] {
      color: #fff; background: #d77651; font-size: clamp(20px, 6vw, 35px);
    }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 21px;
    }

    .hint { color: var(--muted); font-size: 13px; }

    button {
      border: 0;
      cursor: pointer;
      color: #fff;
      background: var(--accent);
      padding: 11px 17px;
      border-radius: 11px;
      font: inherit;
      font-size: 13px;
      font-weight: 750;
      transition: transform .15s, background .15s;
    }

    button:hover { background: var(--accent-dark); transform: translateY(-1px); }
    button:active { transform: translateY(1px); }
    button:disabled { cursor: not-allowed; opacity: .48; transform: none; }

    .secondary {
      color: var(--accent-dark);
      background: rgba(111, 98, 220, .1);
      margin-right: 7px;
    }

    .secondary:hover { background: rgba(111, 98, 220, .18); }

    .message {
      position: absolute;
      inset: 14px;
      display: none;
      place-items: center;
      align-content: center;
      gap: 11px;
      padding: 20px;
      text-align: center;
      border-radius: 13px;
      background: rgba(247, 248, 252, .88);
      backdrop-filter: blur(7px);
    }

    .message.visible { display: grid; }
    .message h2 { margin: 0; font-size: 30px; letter-spacing: -.04em; }
    .message p { margin: 0; color: var(--muted); font-size: 14px; }

    .how-to {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-top: 50px;
      padding: 18px 22px;
      border: 1px solid rgba(119, 130, 157, .16);
      border-radius: 16px;
      color: var(--muted);
      font-size: 13px;
    }

    .keys { display: flex; gap: 5px; flex-shrink: 0; }
    kbd {
      display: grid;
      place-items: center;
      width: 26px;
      height: 26px;
      color: var(--ink);
      border: 1px solid #d5d9e3;
      border-bottom-width: 2px;
      border-radius: 6px;
      background: #fff;
      font-size: 12px;
      font-weight: 800;
    }

    @media (max-width: 560px) {
      .page { padding-top: 28px; }
      .topbar { align-items: center; margin-bottom: 46px; }
      .scores { position: absolute; top: 79px; left: 0; }
      .intro { margin-bottom: 22px; }
      .controls { align-items: flex-start; }
      .hint { max-width: 160px; }
      .how-to { margin-top: 35px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">2⁴</span><span>MINI GAMES</span></div>
      <div class="scores" aria-label="游戏分数">
        <div class="score"><span class="score-label">SCORE</span><span class="score-value" id="score">0</span></div>
        <div class="score"><span class="score-label">BEST</span><span class="score-value" id="best">0</span></div>
      </div>
    </header>

    <section class="intro">
      <h1>2048</h1>
      <p>合并相同数字，挑战你的最高分。</p>
    </section>

    <section class="game-area">
      <div class="board-wrap" id="boardWrap">
        <div class="board" id="board" role="grid" aria-label="2048 游戏棋盘"></div>
        <div class="message" id="message" aria-live="polite">
          <h2 id="messageTitle"></h2>
          <p id="messageText"></p>
          <button id="messageButton">再来一局</button>
        </div>
      </div>
      <div class="controls">
        <span class="hint">使用方向键或 WASD 移动方块</span>
        <div>
          <button class="secondary" id="undoButton">撤销</button>
          <button id="newButton">重新开始</button>
        </div>
      </div>
    </section>

    <div class="how-to">
      <div class="keys"><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd></div>
      <span>滑动或使用键盘移动所有方块。两个相同数字碰撞时会合并。</span>
    </div>
  </main>

  <script>
    (() => {
      const SIZE = 4;
      const boardElement = document.querySelector("#board");
      const scoreElement = document.querySelector("#score");
      const bestElement = document.querySelector("#best");
      const undoButton = document.querySelector("#undoButton");
      const message = document.querySelector("#message");
      const messageTitle = document.querySelector("#messageTitle");
      const messageText = document.querySelector("#messageText");
      const messageButton = document.querySelector("#messageButton");
      const newButton = document.querySelector("#newButton");
      const boardWrap = document.querySelector("#boardWrap");
      let board;
      let score;
      let best = Number(localStorage.getItem("mini2048-best") || 0);
      let previousState = null;
      let won = false;
      let touchStart = null;

      const emptyBoard = () => Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
      const clone = value => value.map(row => [...row]);

      function addRandomTile() {
        const empty = [];
        board.forEach((row, r) => row.forEach((value, c) => {
          if (!value) empty.push([r, c]);
        }));
        if (!empty.length) return;
        const [r, c] = empty[Math.floor(Math.random() * empty.length)];
        board[r][c] = Math.random() < .9 ? 2 : 4;
      }

      function startGame() {
        board = emptyBoard();
        score = 0;
        previousState = null;
        won = false;
        addRandomTile();
        addRandomTile();
        hideMessage();
        render();
      }

      function render() {
        boardElement.replaceChildren();
        board.flat().forEach(value => {
          const cell = document.createElement("div");
          cell.className = "cell";
          cell.dataset.value = value || "";
          cell.textContent = value || "";
          cell.setAttribute("role", "gridcell");
          boardElement.append(cell);
        });
        scoreElement.textContent = score;
        bestElement.textContent = best;
        undoButton.disabled = !previousState;
      }

      function slideLine(line) {
        const values = line.filter(Boolean);
        const result = [];
        let gained = 0;
        for (let i = 0; i < values.length; i++) {
          if (values[i] === values[i + 1]) {
            const merged = values[i] * 2;
            result.push(merged);
            gained += merged;
            i++;
          } else {
            result.push(values[i]);
          }
        }
        while (result.length < SIZE) result.push(0);
        return { result, gained };
      }

      function move(direction) {
        const before = JSON.stringify(board);
        const next = emptyBoard();
        let gained = 0;
        for (let i = 0; i < SIZE; i++) {
          const line = [];
          for (let j = 0; j < SIZE; j++) {
            const r = direction === "up" ? j : direction === "down" ? SIZE - 1 - j : i;
            const c = direction === "left" ? j : direction === "right" ? SIZE - 1 - j : i;
            line.push(board[r][c]);
          }
          const shifted = slideLine(line);
          gained += shifted.gained;
          shifted.result.forEach((value, j) => {
            const r = direction === "up" ? j : direction === "down" ? SIZE - 1 - j : i;
            const c = direction === "left" ? j : direction === "right" ? SIZE - 1 - j : i;
            next[r][c] = value;
          });
        }
        if (JSON.stringify(next) === before) return;
        previousState = { board: clone(board), score };
        board = next;
        score += gained;
        if (score > best) {
          best = score;
          localStorage.setItem("mini2048-best", best);
        }
        addRandomTile();
        render();
        if (!won && board.flat().includes(2048)) {
          won = true;
          showMessage("太棒了！", "你已经合成了 2048。要继续挑战更高分吗？", "继续游戏");
        } else if (!canMove()) {
          showMessage("游戏结束", "棋盘已经没有可以移动的方块了。", "再来一局");
        }
      }

      function canMove() {
        for (let r = 0; r < SIZE; r++) {
          for (let c = 0; c < SIZE; c++) {
            if (!board[r][c]) return true;
            if (c < SIZE - 1 && board[r][c] === board[r][c + 1]) return true;
            if (r < SIZE - 1 && board[r][c] === board[r + 1][c]) return true;
          }
        }
        return false;
      }

      function showMessage(title, text, action) {
        messageTitle.textContent = title;
        messageText.textContent = text;
        messageButton.textContent = action;
        message.classList.add("visible");
      }

      function hideMessage() { message.classList.remove("visible"); }

      function undo() {
        if (!previousState) return;
        board = clone(previousState.board);
        score = previousState.score;
        previousState = null;
        hideMessage();
        render();
      }

      document.addEventListener("keydown", event => {
        const directions = {
          ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right",
          w: "up", s: "down", a: "left", d: "right"
        };
        const direction = directions[event.key];
        if (direction) {
          event.preventDefault();
          move(direction);
        }
      });

      boardWrap.addEventListener("touchstart", event => {
        const touch = event.changedTouches[0];
        touchStart = { x: touch.clientX, y: touch.clientY };
      }, { passive: true });

      boardWrap.addEventListener("touchend", event => {
        if (!touchStart) return;
        const touch = event.changedTouches[0];
        const dx = touch.clientX - touchStart.x;
        const dy = touch.clientY - touchStart.y;
        touchStart = null;
        if (Math.max(Math.abs(dx), Math.abs(dy)) < 25) return;
        move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
      }, { passive: true });

      newButton.addEventListener("click", startGame);
      messageButton.addEventListener("click", () => {
        if (won) hideMessage();
        else startGame();
      });
      undoButton.addEventListener("click", undo);
      startGame();
    })();
  </script>
</body>
</html>
